<!doctype html>
<html>
<head><meta charset="UTF-8"><title>HUI Diag</title></head>
<body>
<div id="out" style="padding:20px;font-family:monospace;font-size:12px;color:#000;background:#fff;white-space:pre-wrap;word-break:break-all"></div>
<script>
var out = document.getElementById('out');
function log(msg) { out.innerHTML += msg + '\n'; }
log('[START] Diagnostic page loaded');

// Fetch the main HTML to get current chunk names
fetch('/app/login').then(r => r.text()).then(html => {
  var scripts = html.match(/assets\/[A-Za-z0-9_-]+\.js/g) || [];
  log('[HTML] Found chunks: ' + scripts.join(', '));
  
  // Try to dynamically import each chunk
  var chunks = [...new Set(scripts)];
  var pending = chunks.length;
  
  chunks.forEach(function(chunk) {
    import('/' + chunk).then(function(m) {
      log('[OK] ' + chunk + ' — exports: ' + Object.keys(m).slice(0,8).join(','));
      pending--;
      if (pending === 0) log('[DONE] All chunks loaded');
    }).catch(function(err) {
      log('[FAIL] ' + chunk + ' — ' + (err && err.message ? err.message : String(err)));
      log('  stack: ' + (err && err.stack ? err.stack.split('\n').slice(0,3).join('\n  ') : 'none'));
      pending--;
      if (pending === 0) log('[DONE] All chunks processed (some failed)');
    });
  });
}).catch(function(err) {
  log('[FETCH-ERROR] ' + err.message);
});
</script>
</body>
</html>
