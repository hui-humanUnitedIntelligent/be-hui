<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />

    <title>HUI Web — Human United Intelligence</title>
    <meta name="description" content="HUI — Ein ruhiges kreatives Netzwerk fuer Menschen die wirken. Verbinde dich mit kreativen Talenten, buche Zusammenarbeit, gestalte Impact." />
    <meta name="theme-color" content="#0DC4B5" />
    <meta name="application-name" content="HUI Web" />

    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180px" href="/apple-touch-icon.png?v=2" />

    <meta property="og:title" content="HUI — Human United Intelligence" />
    <meta property="og:description" content="Ein ruhiges kreatives Netzwerk fuer Menschen die wirken." />
    <meta property="og:type" content="website" />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />

    <!-- DIAGNOSTIC -->
    <script>
      window.__HUI_DIAG__ = ['[HTML] Page loaded'];
      window.addEventListener('error', function(e) {
        window.__HUI_DIAG__.push('[ERROR] ' + (e.error ? e.error.message : e.message) + ' @ ' + (e.filename||'?') + ':' + (e.lineno||0));
      });
      window.addEventListener('unhandledrejection', function(e) {
        window.__HUI_DIAG__.push('[REJECT] ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
      });
    </script>
  </head>
  <body>
    <div id="web-root"></div>
    <div id="diag" style="padding:20px;font-family:monospace;font-size:12px;color:#000;background:#fff;min-height:100px"></div>
    <script type="module" src="/src/web-main.jsx"></script>
    <script>
      // Timeout check: if #web-root is empty after 5s, show diagnostics
      setTimeout(function() {
        var root = document.getElementById('web-root');
        var diag = document.getElementById('diag');
        if (root && !root.hasChildNodes()) {
          if (diag) {
            diag.innerHTML = '<b style="color:red">⚠ React did not render after 5s</b><br>'
              + window.__HUI_DIAG__.join('<br>');
          }
        } else if (diag) {
          diag.innerHTML = '<b style="color:green">✓ React rendered</b><br>'
            + 'web-root children: ' + (root ? root.childElementCount : 'no root') + '<br>'
            + window.__HUI_DIAG__.join('<br>');
        }
      }, 5000);
    </script>
  </body>
</html>
