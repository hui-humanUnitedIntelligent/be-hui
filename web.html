<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />

    <title>HUI Web — Human United Intelligence</title>
    <meta name="description" content="HUI — Ein ruhiges kreatives Netzwerk fuer Menschen die wirken. Verbinde dich mit kreativen Talenten, buche Zusammenarbeit, gestalte Impact." />
    <meta name="theme-color" content="#0DC4B5" />
    <meta name="application-name" content="HUI Web" />

    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />

    <meta property="og:title" content="HUI — Human United Intelligence" />
    <meta property="og:description" content="Ein ruhiges kreatives Netzwerk fuer Menschen die wirken." />
    <meta property="og:type" content="website" />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />

    <!-- HUI WHITESCREEN GUARD v2 (2026-08-22) -->
    <script>
      (function() {
        'use strict';
        window.__HUI_ERRORS__ = [];
        window.__HUI_WS_GUARD__ = { fired: false, renderedAt: 0 };

        // Error listeners (vor allem anderen)
        window.addEventListener('error', function(event) {
          if (!event.error && !event.message) return;
          window.__HUI_ERRORS__.push({
            type: 'error',
            message: event.error ? event.error.message : (event.message || 'Unknown error'),
            stack: event.error ? (event.error.stack || '').substring(0, 2000) : '',
            filename: event.filename || '',
            lineno: event.lineno || 0,
            colno: event.colno || 0,
            timestamp: new Date().toISOString(),
          });
        });

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          window.__HUI_ERRORS__.push({
            type: 'unhandledrejection',
            message: reason && reason.message ? reason.message : String(reason || 'Unknown rejection'),
            stack: reason && reason.stack ? (reason.stack).substring(0, 2000) : '',
            timestamp: new Date().toISOString(),
          });
        });

        // Chunk-Reload Mechanism (stale assets nach Deploy)
        function handleChunkError(msg) {
          if (!msg) return false;
          var isChunkError = msg.indexOf('Failed to fetch dynamically imported module') !== -1
                          || msg.indexOf('Loading chunk') !== -1
                          || msg.indexOf('ChunkLoadError') !== -1
                          || msg.indexOf('Importing a module script failed') !== -1;
          if (!isChunkError) return false;
          var last = Number(sessionStorage.getItem('_hui_chunk_reload') || 0);
          if (Date.now() - last > 10000) {
            sessionStorage.setItem('_hui_chunk_reload', String(Date.now()));
            window.location.reload();
            return true;
          }
          return true;
        }

        function checkQueuedChunkErrors() {
          for (var i = 0; i < window.__HUI_ERRORS__.length; i++) {
            if (handleChunkError(window.__HUI_ERRORS__[i].message)) return;
          }
        }

        // White Screen Detector (5s Fallback)
        // 2s diagnostic: log what's in #web-root
        setTimeout(function() {
          var root = document.getElementById('web-root');
          console.log('[HUI Guard 2s] web-root children:', root ? root.childElementCount : 'no root');
          console.log('[HUI Guard 2s] web-root innerHTML length:', root ? root.innerHTML.length : 0);
          console.log('[HUI Guard 2s] errors caught:', window.__HUI_ERRORS__.length);
        }, 2000);
        setTimeout(function() {
          checkQueuedChunkErrors();
          var root = document.getElementById('web-root');
          if (!root || root.hasChildNodes()) return;
          window.__HUI_WS_GUARD__.fired = true;
          showWhiteScreenError(root);
        }, 5000);

        function escapeHtml(str) {
          if (!str) return '';
          return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        function showWhiteScreenError(root) {
          var errs = window.__HUI_ERRORS__ || [];
          var errCount = errs.length;
          var ts = new Date().toISOString();
          var errDetailsHtml = '';
          if (errCount > 0) {
            for (var i = 0; i < errs.length; i++) {
              var e = errs[i];
              errDetailsHtml += '<div style="margin-bottom:16px">'
                + '<div style="font-weight:600;color:#d32f2f;margin-bottom:4px">'
                + (i + 1) + '. ' + e.type + '</div>'
                + '<div style="color:#333;margin-bottom:4px">' + escapeHtml(e.message) + '</div>';
              if (e.filename) errDetailsHtml += '<div style="color:#888;font-size:11px">@ ' + escapeHtml(e.filename) + ':' + (e.lineno || 0) + ":" + (e.colno || 0) + '</div>';
              if (e.stack) errDetailsHtml += '<pre style="background:#f5f5f5;padding:10px;border-radius:6px;overflow:auto;font-size:11px;line-height:1.5;margin:6px 0;max-height:200px;color:#444;white-space:pre-wrap;word-break:break-word">' + escapeHtml(e.stack) + '</pre>';
              errDetailsHtml += '</div>';
            }
          } else {
            errDetailsHtml = '<p style="color:#888;font-size:13px">Keine Fehler wurden abgefangen.</p>';
            var diag = window.__HUI_DIAG__;
            if (diag) {
              errDetailsHtml += '<div style="margin-top:12px;padding:10px;background:#f0f7f6;border-radius:8px;font-size:12px;color:#333">'
                + '<b>Diagnostic:</b><br>'
                + 'step: ' + (diag.step||'?') + '<br>'
                + 'sentry: ' + (diag.sentry||'?') + '<br>'
                + 'keyboard: ' + (diag.keyboard||'?') + '<br>'
                + 'rootEl: ' + (diag.rootEl||'?') + '<br>'
                + 'crash: ' + (diag.crash||'none') + '<br>'
                + 'stack: ' + (diag.stack ? '<pre style="font-size:10px;white-space:pre-wrap">' + escapeHtml(diag.stack) + '</pre>' : 'none')
                + '</div>';
            } else {
              errDetailsHtml += '<p style="color:#d32f2f;font-size:13px"><b>__HUI_DIAG__ is undefined — module never executed!</b><br>Dies bestätigt einen stillen ES-Modul-Import-Fehler.</p>';
            }
          }

          root.innerHTML = '<div style="position:fixed;inset:0;background:#F9F6F2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow-y:auto">'
            + '<div style="font-size:36px;margin-bottom:8px;opacity:0.7">✦</div>'
            + '<h1 style="font-size:20px;font-weight:700;color:#1a1a1a;margin:0 0 4px 0;text-align:center">HUI Web — Lade-Fehler</h1>'
            + '<p style="font-size:14px;color:#888;margin:0 0 24px 0;text-align:center;max-width:400px">Die App konnte nicht geladen werden. Das kann an einem veralteten Cache oder einem fehlgeschlagenen Update liegen.</p>'
            + (errCount > 0
              ? '<details style="width:100%;max-width:600px;margin-bottom:24px"><summary style="cursor:pointer;font-size:13px;color:#0DC4B5;font-weight:600;padding:8px 0">Fehler-Details (' + errCount + ')</summary><div style="padding:12px;background:#fff;border-radius:10px;border:1px solid rgba(0,0,0,0.08);margin-top:8px">' + errDetailsHtml + '</div></details>'
              : '<div style="width:100%;max-width:600px;margin-bottom:24px;padding:12px;background:#fff;border-radius:10px;border:1px solid rgba(0,0,0,0.08)">' + errDetailsHtml + '</div>')
            + '<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">'
            + '<button onclick="window.location.reload()" style="padding:12px 28px;background:#0DC4B5;border:none;border-radius:14px;color:white;font-size:15px;font-weight:600;cursor:pointer;min-width:140px">Neu laden</button>'
            + '<button onclick="if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(sw){sw.unregister()})}).then(function(){window.location.reload()})}else{window.location.reload()}" style="padding:12px 28px;background:white;border:1px solid rgba(0,0,0,0.12);border-radius:14px;color:#333;font-size:15px;font-weight:600;cursor:pointer;min-width:140px">Cache leeren</button>'
            + '</div>'
            + '<p style="font-size:11px;color:#aaa;margin:24px 0 0 0;text-align:center">HUI Web Guard v2 &middot; ' + ts + '<br>UA: ' + escapeHtml(navigator.userAgent.substring(0, 120)) + '</p>'
            + '</div>';

          // Auto-report (best-effort)
          try {
            var report = 'WHITESCREEN ' + ts + ' ' + window.location.href + ' errors=' + errCount;
            if (errs.length > 0) report += ' err1=' + (errs[0].message || 'N/A').substring(0, 200);
            // Use sendBeacon for fire-and-forget
            if (navigator.sendBeacon) {
              var blob = new Blob([JSON.stringify({
                item_type: 'whitescreen',
                item_id: 'web-' + Date.now(),
                item_title: 'HUI Web White Screen',
                trigger: 'ws-guard-v2',
                error_data: { url: window.location.href, errors: errs.slice(0, 3), ua: navigator.userAgent.substring(0, 200), ts: ts }
              })], { type: 'application/json' });
              navigator.sendBeacon('https://sadb-webhook.b44-hui.workers.dev/', blob);
            }
          } catch(_) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="web-root"></div>
    <script type="module" src="/src/web-main.jsx"></script>
  </body>
</html>
