<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>HUI Web — Human United Intelligence</title>
    <meta name="description" content="HUI — Ein ruhiges kreatives Netzwerk fuer Menschen die wirken." />
    <meta name="theme-color" content="#0DC4B5" />
    <meta name="application-name" content="HUI Web" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta property="og:title" content="HUI — Human United Intelligence" />
    <meta property="og:description" content="Ein ruhiges kreatives Netzwerk fuer Menschen die wirken." />
    <meta property="og:type" content="website" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />

    <!-- DIAG: Visible diagnostic banner -->
    <div id="diag" style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#ff0;color:#000;padding:8px;font-family:monospace;font-size:13px;border:2px solid red">
      [HUI-DIAG] HTML loaded. Waiting for JS...
    </div>
    <script>
      (function() {
        var diag = document.getElementById('diag');
        if (!diag) return;
        
        window.addEventListener('error', function(e) {
          diag.innerHTML += '<br>❌ ERROR: ' + (e.error ? e.error.message : e.message);
          if (e.error && e.error.stack) diag.innerHTML += '<pre style="font-size:10px">' + e.error.stack.substring(0, 500) + '</pre>';
          if (e.filename) diag.innerHTML += '<br>File: ' + e.filename + ':' + e.lineno;
          diag.style.background = '#f00';
          diag.style.color = '#fff';
        });
        
        window.addEventListener('unhandledrejection', function(e) {
          diag.innerHTML += '<br>❌ REJECT: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
          diag.style.background = '#f80';
        });
        
        // Check after 3s and 7s
        setTimeout(function() {
          var root = document.getElementById('web-root');
          var children = root ? root.childNodes.length : 'NULL';
          diag.innerHTML += '<br>[3s] web-root children: ' + children;
          if (root && root.childNodes.length > 0) {
            diag.innerHTML += '<br>[3s] web-root innerHTML length: ' + root.innerHTML.length;
          }
        }, 3000);
        
        setTimeout(function() {
          var root = document.getElementById('web-root');
          var children = root ? root.childNodes.length : 'NULL';
          diag.innerHTML += '<br>[7s] web-root children: ' + children;
          if (children === 0 || children === 'NULL') {
            diag.innerHTML += '<br>❌ REACT DID NOT RENDER';
            diag.style.background = '#f00';
            diag.style.color = '#fff';
          }
        }, 7000);
      })();
    </script>
  </head>
  <body>
    <div id="web-root"></div>
    <script type="module" src="/src/web-main.jsx"></script>
  </body>
</html>
