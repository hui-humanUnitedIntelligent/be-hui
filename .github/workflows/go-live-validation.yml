name: Go-Live Validation

# CI-DISABLE (2026-09-01, Michael): Auto-Trigger entfernt — der Workflow
# erstellte ephemere Test-User auf der LIVE-DB, kaufte echte Werke und
# löschte danach User+Order, OHNE den Stock zu restaurieren. Linda's
# Werk wurde dadurch fälschlich als "VERKAUFT" angezeigt.
# Nur noch manuell über GitHub Actions Tab auslösbar.
on:
  workflow_dispatch:

concurrency:
  group: go-live-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.108.0/supabase_linux_amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase

      - name: Resolve API keys
        id: keys
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase link --project-ref gxztrhvhcxhmunhhkfjd --yes
          ANON=$(supabase projects api-keys --project-ref gxztrhvhcxhmunhhkfjd -o json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(k["api_key"] for k in d if k.get("name")=="anon"))')
          SERVICE=$(supabase projects api-keys --project-ref gxztrhvhcxhmunhhkfjd -o json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(k["api_key"] for k in d if k.get("name")=="service_role"))')
          echo "anon_key=$ANON" >> "$GITHUB_OUTPUT"
          echo "service_key=$SERVICE" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Ensure Stripe webhook + secret
        id: stripe
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: bash scripts/sync-stripe-webhook.sh

      - name: Resolve test work ID
        id: testdata
        env:
          SERVICE_KEY: ${{ steps.keys.outputs.service_key }}
        run: |
          set -euo pipefail
          WORK_ID=$(curl -sfS \
            "https://gxztrhvhcxhmunhhkfjd.supabase.co/rest/v1/commerce_price_authority?select=item_id&item_type=eq.work&limit=1" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[0]["item_id"] if d else "")')
          if [ -z "$WORK_ID" ]; then
            echo "❌ Kein published Werk in commerce_price_authority"
            exit 1
          fi
          echo "work_id=$WORK_ID" >> "$GITHUB_OUTPUT"

      - name: Bootstrap test user
        id: testuser
        env:
          SERVICE_KEY: ${{ steps.keys.outputs.service_key }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASS: ${{ secrets.TEST_USER_PASS }}
        run: |
          set -euo pipefail
          if [ -n "${TEST_USER_EMAIL:-}" ] && [ -n "${TEST_USER_PASS:-}" ]; then
            echo "email=$TEST_USER_EMAIL" >> "$GITHUB_OUTPUT"
            echo "pass=$TEST_USER_PASS" >> "$GITHUB_OUTPUT"
            echo "✅ Test-User aus GitHub Secrets"
            exit 0
          fi

          EMAIL="golive-ci-${GITHUB_RUN_ID}@hui-commerce.test"
          PASS="GoLive${GITHUB_RUN_ID}Test!"
          curl -sfS "https://gxztrhvhcxhmunhhkfjd.supabase.co/auth/v1/admin/users" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\",\"email_confirm\":true}" > /dev/null
          echo "email=$EMAIL" >> "$GITHUB_OUTPUT"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
          echo "✅ Ephemerer Test-User erstellt: $EMAIL"

      - name: Install dependencies and build
        run: npm run build

      - name: Run go-live-validation.js
        env:
          SUPABASE_URL: https://gxztrhvhcxhmunhhkfjd.supabase.co
          SUPABASE_ANON_KEY: ${{ steps.keys.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_key }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ steps.stripe.outputs.whsec || secrets.STRIPE_WEBHOOK_SECRET }}
          TEST_USER_EMAIL: ${{ steps.testuser.outputs.email }}
          TEST_USER_PASS: ${{ steps.testuser.outputs.pass }}
          TEST_WORK_ID: ${{ steps.testdata.outputs.work_id }}
        run: node go-live-validation.js

      - name: Cleanup test data
        if: always()
        env:
          SERVICE_KEY: ${{ steps.keys.outputs.service_key }}
          TEST_USER_EMAIL: ${{ steps.testuser.outputs.email }}
        run: |
          set -euo pipefail
          if [ -z "${TEST_USER_EMAIL:-}" ]; then echo 'No test user to clean up'; exit 0; fi
          # Find the user ID by email.
          # SICHERHEITSFIX (2026-09-01, INC-003): Supabase Admin API ?email=
          # Parameter wird vom GoTrue-Server ignoriert — gibt IMMER die volle
          # User-Liste zurueck. Blindes users[0] hat dadurch einmal einen
          # ECHTEN Nutzer-Account statt des Test-Users geloescht (der Test-
          # User war zu dem Zeitpunkt schon weg). PFLICHT: Email exakt matchen.
          USER_ID=$(curl -sfS "https://gxztrhvhcxhmunhhkfjd.supabase.co/auth/v1/admin/users?email=${TEST_USER_EMAIL}" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            | TEST_EMAIL_LOWER="${TEST_USER_EMAIL,,}" python3 -c 'import json, sys, os; d = json.load(sys.stdin); target = os.environ["TEST_EMAIL_LOWER"]; matches = [u for u in d.get("users", []) if (u.get("email") or "").lower() == target]; print(matches[0]["id"] if matches else "")')
          if [ -z "$USER_ID" ]; then echo 'Test user already gone or no exact email match found'; exit 0; fi
          # STOCK-RESTORE-FIX (2026-09-01): Restore stock for test work BEFORE deleting order
          if [ -n "${{ steps.testdata.outputs.work_id }}" ]; then
            WORK_ID="${{ steps.testdata.outputs.work_id }}"
            curl -sfS -X PATCH "https://gxztrhvhcxhmunhhkfjd.supabase.co/rest/v1/works?id=eq.$WORK_ID" \
              -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" -H "Content-Type: application/json" \
              -d '{"stock_available": 1, "for_sale": true, "is_sold": false}' || true
            echo "✅ Stock restored for work: $WORK_ID"
          fi
          # Delete order_items first (not always cascaded)
          curl -sfS -X DELETE "https://gxztrhvhcxhmunhhkfjd.supabase.co/rest/v1/order_items?order_id=in.(select id from orders where customer_id=eq.$USER_ID)" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" || true
          # Delete orders
          curl -sfS -X DELETE "https://gxztrhvhcxhmunhhkfjd.supabase.co/rest/v1/orders?customer_id=eq.$USER_ID" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" || true
          # Delete stripe_payments
          curl -sfS -X DELETE "https://gxztrhvhcxhmunhhkfjd.supabase.co/rest/v1/stripe_payments?user_id=eq.$USER_ID" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" || true
          # Delete profile
          curl -sfS -X DELETE "https://gxztrhvhcxhmunhhkfjd.supabase.co/rest/v1/profiles?id=eq.$USER_ID" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" || true
          # Delete auth user
          curl -sfS -X DELETE "https://gxztrhvhcxhmunhhkfjd.supabase.co/auth/v1/admin/users/$USER_ID" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" || true
          echo "✅ Cleaned up test user: $TEST_USER_EMAIL ($USER_ID)"
