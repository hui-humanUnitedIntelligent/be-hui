# GitHub Actions: iOS Build for HUI (be-hui)
# Builds the Capacitor iOS app on a macOS runner — no local Mac needed.
# sign=false: unsigned verification build (compiles check only)
# sign=true:  signed IPA for TestFlight / Ad-Hoc distribution via diawi.com

name: iOS Build

on:
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign IPA for distribution (needs Apple secrets)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      distribution:
        description: 'Distribution method (only when sign=true)'
        required: false
        default: 'ad-hoc'
        type: choice
        options:
          - 'ad-hoc'
          - 'app-store'

env:
  NODE_VERSION: '20'
  BUNDLE_ID: 'com.behui.app'
  # GITHUB_RUN_NUMBER is automatically available as env var in GitHub Actions
  # The ruby script reads it via ENV['GITHUB_RUN_NUMBER']

jobs:
  build:
    name: Build iOS
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      # ── 1. Checkout ──
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ── 3. Install dependencies ──
      - name: Install npm dependencies
        run: npm ci

      # ── 4. Build web assets ──
      - name: Build web app (Vite)
        run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      # ── 5. Add iOS platform (first run only) ──
      - name: Add iOS platform if missing
        run: |
          if [ ! -d "ios/App" ]; then
            echo "Creating iOS project (first run)..."
            npx cap add ios
            # Configure Info.plist with permission descriptions
            python3 -c "
            import plistlib, os
            plist_path = 'ios/App/App/Info.plist'
            if os.path.exists(plist_path):
                with open(plist_path, 'rb') as f:
                    plist = plistlib.load(f)
                # Permission descriptions required by App Store
                plist['NSMicrophoneUsageDescription'] = 'HUI benötigt Mikrofonzugang für Sprachnachrichten.'
                plist['NSCameraUsageDescription'] = 'HUI benötigt Kamerazugang für Fotos und Videos.'
                plist['NSPhotoLibraryUsageDescription'] = 'HUI benötigt Zugriff auf deine Fotobibliothek zum Auswählen von Bildern.'
                plist['NSPhotoLibraryAddUsageDescription'] = 'HUI benötigt Zugriff zum Speichern von Bildern in deiner Fotobibliothek.'
                plist['NSLocationWhenInUseUsageDescription'] = 'HUI verwendet deinen Standort für die Umkreissuche und lokale Entdeckungen.'
                # App Transport Security — allow Supabase + Vercel
                plist['NSAppTransportSecurity'] = {
                    'NSAllowsArbitraryLoads': False,
                    'NSAllowsLocalNetworking': True,
                }
                with open(plist_path, 'wb') as f:
                    plistlib.dump(plist, f)
                print('Info.plist updated with permission strings')
            "
          else
            echo "iOS project already exists, syncing..."
          fi

      # ── 6. Sync Capacitor ──
      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # ── 7. Install CocoaPods ──
      - name: Patch Podfile (disable code signing + fix deployment targets for Pod targets)
        run: |
          cd ios/App
          # Replace existing post_install hook (Capacitor generates one) with our own that
          # both fixes deployment targets AND disables code signing for Pod targets
          sed -i '' '/post_install do/,/^end$/d' Podfile
          cat >> Podfile << 'RUBY'
          
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                # Fix deployment target — Xcode 15.4 removed libarclite for iOS < 13
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
                # Disable code signing for Pod targets (only App target signs)
                config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
                config.build_settings['CODE_SIGN_IDENTITY'] = '-'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              end
            end
          end
          RUBY
          echo "Podfile patched: deployment targets + signing disabled for Pods"
      
      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      # ── 8. Build app ──
      - name: Build with xcodebuild
        run: |
          cd ios/App
          if [ "${{ github.event.inputs.sign }}" = "true" ]; then
            # ── Signed build ──
            DISTRIBUTION="${{ github.event.inputs.distribution }}"
            echo "Building signed IPA ($DISTRIBUTION)..."

            # Decode signing certificate + provisioning profile
            echo "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" | base64 --decode > cert.p12
            echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision

            # Extract provisioning profile UUID
            PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")
            echo "Provisioning Profile UUID: $PP_UUID"

            # Create ExportOptions.plist with manual signing
            cat > ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${DISTRIBUTION}</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.behui.app</key>
                  <string>HUI App Store Profile</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          PLIST

            # Create keychain + import certificate
            KEYCHAIN_PASSWORD="build-keychain-$(date +%s)"
            security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security import cert.p12 -k build.keychain -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -A
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

            # Install provisioning profile (named with UUID)
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision
            echo "Provisioning profile installed: $PP_UUID"

            # Patch bundle ID in Xcode project (cap sync doesn't update existing projects)
            sed -i '' 's/com.hui.app/com.behui.app/g' App.xcodeproj/project.pbxproj
            echo "Bundle ID patched to com.behui.app"

            # Patch ONLY the App target with provisioning profile (standalone ruby script — no escaping hell)
            GITHUB_RUN_NUMBER="${{ github.run_number }}" ruby ../../scripts/patch_ios_signing.rb

            # Archive with manual signing (NO PROVISIONING_PROFILE_SPECIFIER on command line — it leaks to Pods)
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -archivePath build/App.xcarchive \
              -sdk iphoneos \
              archive \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="iPhone Distribution" \
              DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES

            # Export IPA
            xcodebuild -exportArchive \
              -archivePath build/App.xcarchive \
              -exportPath build/ipa \
              -exportOptionsPlist ExportOptions.plist

            # List the exported IPA
            echo "=== IPA created ==="
            find build/ipa -name "*.ipa" -exec ls -lh {} \;
          else
            # ── Unsigned build for verification ──
            echo "Building unsigned app (verification only)..."
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build

            # Try to create an unsigned .app → .ipa for manual testing
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -path "*/Build/Products/Release-iphoneos/*" | head -1)
            if [ -n "$APP_PATH" ]; then
              mkdir -p build/ipa/Payload
              cp -R "$APP_PATH" build/ipa/Payload/
              cd build/ipa
              zip -r HUI-unsigned.ipa Payload
              echo "=== Unsigned IPA created ==="
              ls -lh HUI-unsigned.ipa
            fi
          fi

      # ── 9. Upload IPA artifact ──
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: github.event.inputs.sign == 'true'
        with:
          name: hui-ios-ipa
          path: ios/App/build/ipa/*.ipa
          retention-days: 30


      # ── 9b. Upload to TestFlight (App Store Connect) ──
      # Requires 3 GitHub Secrets:
      #   APP_STORE_CONNECT_KEY_ID     - Key ID (e.g., ABC1234DEF)
      #   APP_STORE_CONNECT_ISSUER_ID  - Issuer ID (UUID)
      #   APP_STORE_CONNECT_API_KEY    - Base64-encoded .p8 private key
      # Also requires the App to already exist in App Store Connect.
      - name: Upload to TestFlight
        if: github.event.inputs.sign == 'true' && github.event.inputs.distribution == 'app-store'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_API_KEY" ]; then
            echo "App Store Connect API key secrets not set - skipping TestFlight upload."
            echo "  To enable: add APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_API_KEY"
            echo "  IPA is still available as artifact for manual Transporter upload."
            exit 0
          fi

          echo "Setting up App Store Connect API key..."
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          chmod 600 ~/private_keys/AuthKey_$ASC_KEY_ID.p8

          IPA_PATH=$(find ios/App/build/ipa -name "*.ipa" | head -1)
          echo "Uploading to TestFlight: $IPA_PATH"

          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose

          echo "Uploaded to TestFlight - check App Store Connect for processing status."
      # ── 10. Upload unsigned IPA (verification) ──
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        if: github.event.inputs.sign == 'false'
        with:
          name: hui-ios-unsigned
          path: ios/App/build/ipa/*.ipa
          retention-days: 14

      # ── 11. Upload full build logs (debug) ──
      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-logs
          path: |
            ios/App/build/
            !ios/App/build/ipa/*.ipa
          retention-days: 7
