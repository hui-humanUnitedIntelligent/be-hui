name: TestFlight External Group

# Legt die EXTERNE TestFlight-Testgruppe "Beta Tester" an (inkl. Public Link),
# assign Build #22 (2.1.541) und reicht den Build zur Beta App Review ein.
# Nutzt ausschließlich die bestehenden APP_STORE_CONNECT_* Secrets.
# Manuell triggern: Actions → TestFlight External Group → Run workflow
# oder via API: POST /repos/{repo}/actions/workflows/testflight-external.yml/dispatches

on:
  workflow_dispatch:
    inputs:
      group_name:
        description: 'Name der externen Testgruppe'
        required: false
        default: 'Beta Tester'
      submit_for_review:
        description: 'Build zur Beta App Review einreichen (true/false)'
        required: false
        default: 'true'
      contact_first:
        description: 'Review-Kontakt Vorname (für betaAppReviewDetails, falls fehlend)'
        required: false
        default: ''
      contact_last:
        description: 'Review-Kontakt Nachname'
        required: false
        default: ''
      contact_email:
        description: 'Review-Kontakt E-Mail'
        required: false
        default: ''
      contact_phone:
        description: 'Review-Kontakt Telefon (Apple-Pflichtfeld)'
        required: false
        default: ''
      demo_email:
        description: 'Demo-Account E-Mail für Apple Review (Login-Test)'
        required: false
        default: 'apple.reviewer@be-hui.app'
      demo_password:
        description: 'Demo-Account Passwort für Apple Review'
        required: false
        default: ''

jobs:
  create-external-group:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
    steps:
      - name: Check secrets present
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_API_KEY" ]; then
            echo "::error::APP_STORE_CONNECT_* Secrets fehlen in GitHub!"
            exit 1
          fi

      - name: Setup Python + JWT-Lib
        run: |
          python3 -m pip install --quiet pyjwt cryptography requests

      - name: Create external group, assign build, submit for review
        run: |
          mkdir -p /tmp/asc
          echo "$ASC_API_KEY" | base64 --decode > /tmp/asc/AuthKey.p8
          export ASC_KEY_PATH=/tmp/asc/AuthKey.p8
          export GROUP_NAME="${{ github.event.inputs.group_name || 'Beta Tester' }}"
          export SUBMIT_REVIEW="${{ github.event.inputs.submit_for_review || 'true' }}"
          export CONTACT_FIRST="${{ github.event.inputs.contact_first }}"
          export CONTACT_LAST="${{ github.event.inputs.contact_last }}"
          export CONTACT_EMAIL="${{ github.event.inputs.contact_email }}"
          export CONTACT_PHONE="${{ github.event.inputs.contact_phone }}"
          export DEMO_EMAIL="${{ github.event.inputs.demo_email }}"
          export DEMO_PASSWORD="${{ github.event.inputs.demo_password }}"
          cat > /tmp/asc/run.py << 'PYEOF'
          import os, json, time, requests, jwt

          KEY_ID = os.environ["ASC_KEY_ID"]
          ISSUER = os.environ["ASC_ISSUER_ID"]
          KEY_PATH = os.environ["ASC_KEY_PATH"]
          GROUP_NAME = os.environ["GROUP_NAME"]
          SUBMIT_REVIEW = os.environ["SUBMIT_REVIEW"].lower() == "true"

          BASE = "https://api.appstoreconnect.apple.com/v1"
          BUNDLE_ID = "com.behui.app"

          with open(KEY_PATH) as f:
              private_key = f.read()

          now = int(time.time())
          token = jwt.encode(
              {"iss": ISSUER, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"},
              private_key, algorithm="ES256", headers={"kid": KEY_ID},
          )
          H = {"Authorization": "Bearer " + token, "Content-Type": "application/json"}

          def api(method, path, body=None, ok=(200, 201)):
              r = requests.request(method, BASE + path, headers=H, json=body, timeout=30)
              print("[ASC] {} {} -> {}".format(method, path, r.status_code))
              if r.status_code not in ok:
                  print("[ASC] ERROR BODY: " + r.text[:2000])
              return r

          # 1. App finden
          r = api("GET", "/apps?filter[bundleId]={}&limit=1".format(BUNDLE_ID))
          r.raise_for_status()
          apps = r.json()["data"]
          assert apps, "App " + BUNDLE_ID + " nicht in App Store Connect gefunden!"
          APP_ID = apps[0]["id"]
          print("APP_ID: {} ({})".format(APP_ID, apps[0]["attributes"]["name"]))

          # 2. Neuesten verarbeiteten Build finden
          r = api("GET", "/apps/{}/builds?limit=20".format(APP_ID))
          r.raise_for_status()
          builds = r.json()["data"]
          assert builds, "Keine Builds gefunden!"
          builds.sort(key=lambda b: b["attributes"].get("uploadedDate") or "", reverse=True)
          build = next((b for b in builds if b["attributes"].get("processingState") == "VALID"), builds[0])
          BUILD_ID = build["id"]
          battr = build["attributes"]
          print("BUILD: {} uploaded: {} state: {}".format(
              battr.get("version"), battr.get("uploadedDate"), battr.get("processingState")))

          # 3. Externe Gruppe finden oder anlegen
          r = api("GET", "/apps/{}/betaGroups?limit=50".format(APP_ID))
          r.raise_for_status()
          groups = r.json()["data"]
          group = next((g for g in groups
                        if g["attributes"]["name"] == GROUP_NAME
                        and not g["attributes"]["isInternalGroup"]), None)

          if group:
              print("Gruppe '{}' existiert bereits: {}".format(GROUP_NAME, group["id"]))
          else:
              r = api("POST", "/betaGroups", {
                  "data": {
                      "type": "betaGroups",
                      "attributes": {"name": GROUP_NAME, "isInternalGroup": False},
                      "relationships": {"app": {"data": {"type": "apps", "id": APP_ID}}},
                  }
              }, ok=(200, 201, 409))
              if r.status_code in (200, 201):
                  group = r.json()["data"]
                  print("Gruppe '{}' angelegt: {}".format(GROUP_NAME, group["id"]))
              else:
                  r2 = api("GET", "/apps/{}/betaGroups?limit=50".format(APP_ID))
                  group = next((g for g in r2.json()["data"]
                                if g["attributes"]["name"] == GROUP_NAME
                                and not g["attributes"]["isInternalGroup"]), None)
                  assert group, "Gruppe konnte nicht angelegt werden: " + r.text[:500]
                  print("Gruppe nach 409 erneut gefunden: " + group["id"])

          GROUP_ID = group["id"]

          # 4. Public Link aktivieren (falls noch nicht)
          if not group["attributes"].get("publicLinkEnabled"):
              r = api("PATCH", "/betaGroups/{}".format(GROUP_ID), {
                  "data": {"type": "betaGroups", "id": GROUP_ID,
                           "attributes": {"publicLinkEnabled": True}}
              })
              if r.status_code != 200:
                  print("[WARN] Public Link konnte nicht aktiviert werden: " + r.text[:500])

          # 5. Build der Gruppe zuweisen
          r = api("POST", "/builds/{}/relationships/betaGroups".format(BUILD_ID), {
              "data": [{"type": "betaGroups", "id": GROUP_ID}]
          }, ok=(200, 201, 204))
          if r.status_code in (200, 201, 204):
              print("BUILD der Gruppe zugewiesen ✅")
          else:
              print("[WARN] Build-Zuweisung fehlgeschlagen (evtl. schon zugewiesen)")

          # 6. Public Link URL auslesen (Apple generiert ihn asynchron)
          time.sleep(3)
          r = api("GET", "/apps/{}/betaGroups?limit=50".format(APP_ID))
          if r.status_code == 200:
              g2 = next((g for g in r.json()["data"] if g["id"] == GROUP_ID), None)
              if g2:
                  link = g2["attributes"].get("publicLink")
                  print("PUBLIC LINK: " + (link or "(noch nicht generiert — Apple asynchron, in ASC sichtbar)"))

          # 7. Beta App Review: Details prüfen
          r = api("GET", "/apps/{}/betaAppReviewDetails".format(APP_ID), ok=(200, 404))
          details_ok = r.status_code == 200
          if details_ok:
              print("Beta App Review Details vorhanden ✅")
          else:
              cf = os.environ.get("CONTACT_FIRST", "")
              cl = os.environ.get("CONTACT_LAST", "")
              ce = os.environ.get("CONTACT_EMAIL", "")
              cp = os.environ.get("CONTACT_PHONE", "")
              demo_email = os.environ.get("DEMO_EMAIL", "")
              demo_pw = os.environ.get("DEMO_PASSWORD", "")
              if cf and cl and ce and cp:
                  attrs = {
                      "contactFirstName": cf, "contactLastName": cl,
                      "contactEmail": ce, "contactPhone": cp,
                  }
                  if demo_email and demo_pw:
                      attrs["demoAccountRequired"] = True
                      attrs["demoAccountName"] = demo_email
                      attrs["demoAccountPassword"] = demo_pw
                      attrs["notes"] = ("Demo-Login zum Testen bereits vorhanden (siehe demoAccountName/"
                                         "demoAccountPassword oben). App ist eine soziale/kreative "
                                         "Community-Plattform (HUI). Kein Zahlungsablauf im Testkonto nötig.")
                  else:
                      attrs["demoAccountRequired"] = False
                  r = api("POST", "/betaAppReviewDetails", {
                      "data": {
                          "type": "betaAppReviewDetails",
                          "attributes": attrs,
                          "relationships": {"app": {"data": {"type": "apps", "id": APP_ID}}},
                      }
                  }, ok=(201, 409))
                  details_ok = r.status_code in (201, 409)
                  if details_ok:
                      print("Beta App Review Details angelegt ✅")
              else:
                  print("[WARN] Beta App Review Details FEHLEN — Kontaktinfo (Name/E-Mail/Telefon) nötig")
                  print("        Entweder in ASC UI eintragen ODER Workflow mit contact_*-Inputs triggern")

          # 8. Review-Einreichung
          if SUBMIT_REVIEW:
              if not details_ok:
                  print("[SKIP] Review-Einreichung übersprungen — erst Details in App Store Connect hinterlegen:")
                  print("        TestFlight → Beta Tester → Gruppen-Details → Kontaktinfo")
                  print("        Danach diesen Workflow erneut triggern (submit_for_review=true).")
              else:
                  r = api("POST", "/betaAppReviewSubmissions", {
                      "data": {
                          "type": "betaAppReviewSubmissions",
                          "relationships": {"build": {"data": {"type": "builds", "id": BUILD_ID}}},
                      }
                  }, ok=(201, 409))
                  if r.status_code == 201:
                      print("BUILD ZUR BETA APP REVIEW EINGEREICHT ✅ (Review meist einige Stunden, max. 48h)")
                  elif r.status_code == 409:
                      print("Review-Einreichung existiert bereits (409) ✅")

          # 9. Beta App Beschreibung + "Was zu testen ist" (beschleunigt Apple-Review, optional aber empfohlen)
          BETA_DESCRIPTION = (
              "HUI (Human United Intelligence) ist eine soziale Plattform, auf der Menschen ihre "
              "Talente, Werke und Erlebnisse zeigen, sich vernetzen und gemeinsam Wirkung erzeugen "
              "koennen (Impact-Voting-System). Bitte mit dem bereitgestellten Demo-Account einloggen."
          )
          WHATS_TO_TEST = (
              "Bitte folgende Kernfunktionen testen: 1) Registrierung/Login. 2) Profil ansehen und "
              "bearbeiten (Avatar/Cover-Foto hochladen). 3) Im Discover-Bereich Talente/Werke/Erlebnisse "
              "durchsuchen. 4) Ein Werk oder Talent-Angebot anschauen. 5) Chat mit einem anderen Nutzer "
              "starten. 6) Impact-Voting im Bereich 'Wirkung' testen. Feedback gerne per E-Mail an "
              "huiwirken@gmail.com."
          )

          r = api("GET", "/apps/{}/betaAppLocalizations".format(APP_ID))
          if r.status_code == 200:
              locs = r.json()["data"]
              de_loc = next((l for l in locs if l["attributes"].get("locale") == "de-DE"), None)
              if de_loc:
                  api("PATCH", "/betaAppLocalizations/{}".format(de_loc["id"]), {
                      "data": {"type": "betaAppLocalizations", "id": de_loc["id"],
                               "attributes": {"description": BETA_DESCRIPTION,
                                              "feedbackEmail": "huiwirken@gmail.com"}}
                  }, ok=(200,))
                  print("Beta App Localization (de-DE) aktualisiert")
              elif locs:
                  loc0 = locs[0]
                  api("PATCH", "/betaAppLocalizations/{}".format(loc0["id"]), {
                      "data": {"type": "betaAppLocalizations", "id": loc0["id"],
                               "attributes": {"description": BETA_DESCRIPTION,
                                              "feedbackEmail": "huiwirken@gmail.com"}}
                  }, ok=(200,))
                  print("Beta App Localization ({}) aktualisiert".format(loc0["attributes"].get("locale")))

          # "Was zu testen ist" gehört zur Build-Localization
          r = api("GET", "/builds/{}/betaBuildLocalizations".format(BUILD_ID))
          if r.status_code == 200:
              blocs = r.json()["data"]
              de_bloc = next((l for l in blocs if l["attributes"].get("locale") == "de-DE"), None)
              if de_bloc:
                  api("PATCH", "/betaBuildLocalizations/{}".format(de_bloc["id"]), {
                      "data": {"type": "betaBuildLocalizations", "id": de_bloc["id"],
                               "attributes": {"whatsToTest": WHATS_TO_TEST}}
                  }, ok=(200,))
                  print("Beta Build Localization (de-DE, whatsToTest) aktualisiert")
              else:
                  r2 = api("POST", "/betaBuildLocalizations", {
                      "data": {"type": "betaBuildLocalizations",
                               "attributes": {"locale": "de-DE", "whatsToTest": WHATS_TO_TEST},
                               "relationships": {"build": {"data": {"type": "builds", "id": BUILD_ID}}}}
                  }, ok=(201, 409))
                  if r2.status_code == 201:
                      print("Beta Build Localization (de-DE, whatsToTest) angelegt")

          print("")
          print("=== ZUSAMMENFASSUNG ===")
          print(json.dumps({
              "app": APP_ID, "build": BUILD_ID, "group": GROUP_ID,
              "review_details": details_ok, "submitted": SUBMIT_REVIEW and details_ok,
          }, indent=2))
          PYEOF
          python3 /tmp/asc/run.py
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/asc
