<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head>
<body style="margin:0;padding:20px;font-family:monospace;font-size:13px;">
<div id="r">Loading...</div>
<script>
window.addEventListener('error', function(e) {
  document.getElementById('r').innerHTML += "<br>UNHANDLED: " + (e.error?.message || e.message) + " at " + (e.filename||"") + ":" + (e.lineno||"") + "<br>" + ((e.error?.stack||"").toString().slice(0,1000));
});
window.addEventListener('unhandledrejection', function(e) {
  document.getElementById('r').innerHTML += "<br>REJECTION: " + (e.reason?.message || e.reason) + "<br>" + ((e.reason?.stack||"").toString().slice(0,1000));
});
</script>
<script type="module">
const r=document.getElementById('r');

// Step 1: Fetch the index chunk as text
r.innerHTML = "Step 1: Fetching index chunk...<br>";
try {
  const resp = await fetch("/assets/index-BaQZwdLy.js");
  r.innerHTML += "Status: " + resp.status + "<br>";
  r.innerHTML += "Content-Type: " + resp.headers.get("content-type") + "<br>";
  r.innerHTML += "Content-Length: " + resp.headers.get("content-length") + "<br>";
  
  const text = await resp.text();
  r.innerHTML += "Body length: " + text.length + "<br>";
  r.innerHTML += "First 100 chars: " + text.slice(0, 100) + "<br>";
  r.innerHTML += "Is HTML? " + text.startsWith("<!") + "<br>";
  
  if (text.startsWith("<!")) {
    r.innerHTML += "❌ Got HTML instead of JS! CDN caching issue.<br>";
  } else {
    // Step 2: Create a blob URL and try to import
    r.innerHTML += "<br>Step 2: Creating blob and importing...<br>";
    const blob = new Blob([text], { type: "application/javascript" });
    const blobUrl = URL.createObjectURL(blob);
    try {
      const mod = await import(blobUrl);
      r.innerHTML += "✅ Blob import OK (keys:" + Object.keys(mod).length + ")<br>";
    } catch(e) {
      r.innerHTML += "❌ Blob import FAILED: " + e.message + "<br>";
      r.innerHTML += "Stack: " + (e.stack || "").slice(0, 1000) + "<br>";
    }
  }
} catch(e) {
  r.innerHTML += "❌ Fetch failed: " + e.message + "<br>";
}
</script>
</body></html>
