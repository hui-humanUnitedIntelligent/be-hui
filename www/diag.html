<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head>
<body style="margin:0;padding:20px;font-family:monospace;font-size:13px;">
<div id="r">Testing...</div>
<script type="module">
const r = document.getElementById('r');
let h = "";

// Test 1: Simple inline import
h += "Test 1: Simple dynamic import<br>";
try {
  const blob = new Blob(["export const x = 42;"], { type: "application/javascript" });
  const url = URL.createObjectURL(blob);
  const mod = await import(url);
  h += "✅ Simple import OK: " + mod.x + "<br>";
} catch(e) {
  h += "❌ Simple import: " + e.message + "<br>";
}

// Test 2: Import vendor
h += "<br>Test 2: Import vendor<br>";
try {
  const mod = await import("/assets/vendor-C_tQ69lJ.js");
  h += "✅ Vendor OK (keys:" + Object.keys(mod).length + ")<br>";
} catch(e) {
  h += "❌ Vendor: " + e.message + "<br>";
}

// Test 3: Import index directly
h += "<br>Test 3: Import index<br>";
try {
  const mod = await import("/assets/index-BaQZwdLy.js");
  h += "✅ Index OK (keys:" + Object.keys(mod).length + ")<br>";
} catch(e) {
  h += "❌ Index: " + e.message + "<br>";
}

// Test 4: Create a script tag that loads the index chunk
h += "<br>Test 4: Script tag approach<br>";
const script = document.createElement('script');
script.type = 'module';
script.textContent = `
  window.__indexResult = "loading";
  try {
    const mod = await import("/assets/index-BaQZwdLy.js");
    window.__indexResult = "ok:" + Object.keys(mod).length;
  } catch(e) {
    window.__indexResult = "error:" + e.message;
    window.__indexError = e;
  }
`;
document.head.appendChild(script);
await new Promise(resolve => setTimeout(resolve, 5000));
h += "Script result: " + window.__indexResult + "<br>";
if (window.__indexError) {
  h += "Error details: " + window.__indexError.message + "<br>";
  h += "Stack: " + (window.__indexError.stack || "").slice(0, 1000) + "<br>";
}

r.innerHTML = h;
</script>
</body></html>
