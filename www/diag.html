<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head>
<body style="margin:0;padding:20px;font-family:monospace;font-size:13px;">
<div id="r">Loading...</div>
<script>
window.addEventListener('error', function(e) {
  document.getElementById('r').innerHTML += "<br>UNHANDLED: " + (e.error?.message || e.message) + " at line " + (e.lineno||"") + ":" + (e.colno||"") + "<br>" + ((e.error?.stack||"").toString().slice(0,1500));
});
</script>
<script type="module">
const r = document.getElementById('r');
r.innerHTML = "Fetching chunks...<br>";

// Fetch both vendor and index
const [vendorResp, indexResp] = await Promise.all([
  fetch("/assets/vendor-C_tQ69lJ.js"),
  fetch("/assets/index-BaQZwdLy.js")
]);

const vendorText = await vendorResp.text();
const indexText = await indexResp.text();
r.innerHTML += "vendor: " + vendorText.length + " chars<br>";
r.innerHTML += "index: " + indexText.length + " chars<br>";

// Create blob URLs for both, and rewrite the import in index to use the blob URL
const vendorBlob = new Blob([vendorText], { type: "application/javascript" });
const vendorUrl = URL.createObjectURL(vendorBlob);

// Replace the relative import in index with the blob URL
let modifiedIndex = indexText.replace(
  /from"\.\/vendor-C_tQ69lJ\.js"/g,
  'from"' + vendorUrl + '"'
);

r.innerHTML += "Modified index: " + modifiedIndex.length + " chars<br>";
r.innerHTML += "Replaced imports: " + (indexText.match(/from"\.\/vendor/g) || []).length + "<br>";

const indexBlob = new Blob([modifiedIndex], { type: "application/javascript" });
const indexUrl = URL.createObjectURL(indexBlob);

r.innerHTML += "Importing modified index...<br>";
try {
  const mod = await import(indexUrl);
  r.innerHTML += "✅ Index import OK (keys: " + Object.keys(mod).length + ")<br>";
} catch(e) {
  r.innerHTML += "❌ Index import FAILED: " + e.message + "<br>";
  r.innerHTML += "Stack: " + (e.stack || "").slice(0, 1500) + "<br>";
}
</script>
</body></html>
